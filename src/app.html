<!doctype html>
<html lang="en" data-theme="matcha">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#eaf3de" />
		<title>FLAVOURS — music, freshly squeezed</title>
		<meta name="description" content="A flavourful YouTube-powered music player." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Apply saved flavour before first paint to avoid a flash.
			try {
				const saved = localStorage.getItem('flavour:theme');
				if (saved) document.documentElement.dataset.theme = saved;
			} catch {
				/* private mode — fall back to default flavour */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="eager">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
